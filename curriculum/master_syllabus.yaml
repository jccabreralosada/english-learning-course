schema_version: 1.0.0
document_status: draft_for_review
purpose: Source-grounded editorial outline, not an official CEFR accreditation or a reproduction of the books.
program_goal: Integrated progress toward strong C1 ability across grammar, vocabulary, writing, listening, speaking,
  pronunciation.
editorial_policy:
  source_sequence: Preserve English File fourth edition level/unit/lesson sequence; add prerequisite links and remediation
    where needed.
  cefr: Add CEFR descriptors to each learning outcome after review; never infer equivalence solely from textbook
    level name.
  source_integrity: Topics in levels are derived from provided TOCs; supplementary objectives must carry origin=program_extension.
  copyright: Publish entirely original explanations, exercises, illustrations; do not publish textbook scans or
    copyrighted excerpts.
assessment:
  skills:
  - grammar
  - vocabulary
  - writing
  - listening
  - speaking
  - pronunciation
  importance: equal at program level
  target_score: 90
  states:
  - not_started
  - learning
  - in_consolidation
  - mastered
  - needs_reinforcement
  note: Exact scoring/rubrics are described in assessment_framework.md.
