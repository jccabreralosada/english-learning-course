name: Visual Elementary Unit 1 review

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/elementary/unit_01/**'
      - 'docs/elementary/index.md'
      - 'mkdocs.yml'
      - 'scripts/visual_review.py'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-pilot:
    name: visual-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material and Playwright
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Strict build
        run: mkdocs build --strict --site-dir site
      - name: Start local preview server
        run: |
          python -m http.server 8765 --directory site > /tmp/mkdocs_preview.log 2>&1 &
          echo $! > /tmp/mkdocs_preview.pid
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/elementary/unit_01/lesson_b/") as r:
                      assert r.status == 200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Preview server not ready")
          PY
      - name: Browser screenshot and interaction checks
        run: python scripts/visual_review.py --lesson b --site-dir site --output-dir visual-review
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elementary-1b-visual-review
          path: visual-review/
          retention-days: 14
