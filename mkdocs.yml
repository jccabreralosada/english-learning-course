site_name: English Learning Program
site_description: Original English learning materials from Elementary to Advanced Plus
site_url: https://jccabreralosada.github.io/english-learning-course/
repo_url: https://github.com/jccabreralosada/english-learning-course
repo_name: jccabreralosada/english-learning-course
docs_dir: docs
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: teal
    - scheme: slate
      primary: indigo
      accent: teal
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Curriculum:
      - Overview: curriculum/index.md
  - Levels:
      - Elementary:
          - Overview: elementary/index.md
          - 1A — Welcome to the class: elementary/unit_01/lesson_a.md
          - 1B — One world: elementary/unit_01/lesson_b.md
          - 1C — What's your email?: elementary/unit_01/lesson_c.md
      - Pre-intermediate: pre_intermediate/index.md
      - Intermediate: intermediate/index.md
      - Intermediate Plus: intermediate_plus/index.md
      - Upper-intermediate: upper_intermediate/index.md
      - Advanced: advanced/index.md
      - Advanced Plus: advanced_plus/index.md
  - English Quick Reference:
      - Overview: reference/index.md
      - Verb Forms: reference/verb-forms.md
      - Everyday Vocabulary: reference/everyday-vocabulary.md
      - Grammar Rules: reference/grammar-rules.md
      - Phrasal Verbs: reference/phrasal-verbs.md
      - Collocations: reference/collocations.md
      - Useful Expressions: reference/useful-expressions.md
      - Confusing Words: reference/confusing-words.md
      - Numbers & Dates: reference/numbers-dates.md
