<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" role="img" aria-labelledby="title desc"><title id="title">Choose a possessive adjective from the owner</title><desc id="desc">Three examples show that the owner determines the adjective: I have a notebook becomes my notebook; she has a laptop becomes her laptop; they have two bags becomes their bags. The object does not determine the possessive adjective.</desc><rect width="640" height="650" rx="22" fill="#f6f8fc"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="49" font-size="25" font-weight="bold" fill="#182c45">WHO owns it?</text><text x="28" y="77" font-size="17" fill="#334b63">Choose the word from the owner, not the object.</text><rect x="24" y="99" width="592" height="148" rx="15" fill="#fff" stroke="#3169a5" stroke-width="3"/><rect x="25" y="100" width="590" height="46" rx="14" fill="#dceaff"/><text x="44" y="132" font-size="22" font-weight="bold" fill="#153d77">I → my</text><text x="44" y="188" font-size="22" fill="#182c45">I am Maya. This is my notebook.</text><text x="44" y="220" font-size="17" fill="#334b63">The notebook belongs to me.</text><rect x="24" y="262" width="592" height="148" rx="15" fill="#fff" stroke="#14775e" stroke-width="3"/><rect x="25" y="263" width="590" height="46" rx="14" fill="#d8f2e7"/><text x="44" y="295" font-size="22" font-weight="bold" fill="#0a5f4c">she → her</text><text x="44" y="351" font-size="22" fill="#182c45">Lina is here. Her laptop is ready.</text><text x="44" y="383" font-size="17" fill="#334b63">The laptop belongs to Lina.</text><rect x="24" y="425" width="592" height="148" rx="15" fill="#fff" stroke="#854e9f" stroke-width="3"/><rect x="25" y="426" width="590" height="46" rx="14" fill="#f0e3fc"/><text x="44" y="458" font-size="22" font-weight="bold" fill="#63317c">they → their</text><text x="44" y="514" font-size="22" fill="#182c45">They are students. Their bags are blue.</text><text x="44" y="546" font-size="17" fill="#334b63">The bags belong to those students.</text><text x="28" y="616" font-size="16" fill="#334b63">my / her / their come before the noun. The owner controls the choice.</text></g></svg>