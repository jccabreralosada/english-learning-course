<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 650" role="img" aria-labelledby="title desc">
<title id="title">Affirmative, negative and question patterns with be</title>
<desc id="desc">Three vertically arranged cards compare You are from Peru, You are not from Peru, and Are you from Peru? The question places are before you. Short answers are Yes, I am and No, I'm not.</desc>
<rect x="0" y="0" width="660" height="650" rx="22" fill="#f6f8fc"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="28" y="46" fill="#172b4d" font-size="25" font-weight="bold">BE: one verb, three patterns</text>
<text x="28" y="77" fill="#344e68" font-size="17">Watch the position of the verb.</text>
<rect x="24" y="98" width="612" height="132" rx="16" fill="#fff" stroke="#3169a5" stroke-width="3"/>
<rect x="25" y="99" width="610" height="43" rx="14" fill="#dceaff"/>
<text x="44" y="128" fill="#163e77" font-size="21" font-weight="bold">AFFIRMATIVE</text>
<text x="44" y="184" fill="#172b4d" font-size="25">You <tspan fill="#163e77" font-weight="bold">are</tspan> from Peru.</text>
<rect x="24" y="250" width="612" height="148" rx="16" fill="#fff" stroke="#1c7964" stroke-width="3"/>
<rect x="25" y="251" width="610" height="43" rx="14" fill="#d9f4e9"/>
<text x="44" y="280" fill="#0e634e" font-size="21" font-weight="bold">NEGATIVE = add not</text>
<text x="44" y="339" fill="#172b4d" font-size="25">You <tspan fill="#0e634e" font-weight="bold">are not</tspan> from Peru.</text>
<text x="44" y="370" fill="#344e68" font-size="17">You aren't from Peru.</text>
<rect x="24" y="416" width="612" height="171" rx="16" fill="#fff" stroke="#8351a5" stroke-width="3"/>
<rect x="25" y="417" width="610" height="43" rx="14" fill="#f0e4fc"/>
<text x="44" y="446" fill="#663388" font-size="21" font-weight="bold">QUESTION = move be first</text>
<text x="44" y="505" fill="#172b4d" font-size="25"><tspan fill="#663388" font-weight="bold">Are</tspan> you from Peru?</text>
<text x="44" y="545" fill="#344e68" font-size="19">Yes, I am. / No, I'm not.</text>
<text x="28" y="626" fill="#344e68" font-size="15">Original diagram · same subject and place, different meaning.</text>
</g>
</svg>